<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MY APPS HUB</title>
    <style>
        /* ---------- RESET & GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.2s, color 0.2s;
        }

        body.dark { background-color: #0f172a; color: #e2e8f0; }

        /* ---------- UTILITIES ---------- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .w-full { width: 100%; }
        .text-sm { font-size: 13px; }
        .text-xs { font-size: 11px; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }

        /* ---------- LOGIN SCREEN ---------- */
        #loginScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px; background: white;
        }
        body.dark #loginScreen { background: #0f172a; }
        .login-card { width: 100%; max-width: 340px; }
        .logo-circle {
            width: 60px; height: 60px; background: #3b82f6; border-radius: 16px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
        }
        .logo-circle svg { width: 32px; height: 32px; fill: white; }
        .app-title { font-size: 22px; font-weight: 700; text-align: center; letter-spacing: -0.3px; margin-bottom: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
        .input-group label { font-size: 13px; font-weight: 500; color: #475569; }
        body.dark .input-group label { color: #94a3b8; }
        .input-group input {
            padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1;
            font-size: 15px; background: white; color: #0f172a; outline: none;
        }
        body.dark .input-group input { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .input-group input:focus { border-color: #3b82f6; }
        .password-wrapper { position: relative; }
        .password-wrapper input { width: 100%; padding-right: 48px; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; font-size: 12px; color: #64748b; font-weight: 600;
        }
        .btn-primary {
            background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
        }
        .error-msg { color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }

        /* ---------- MAIN APP ---------- */
        #mainApp { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 72px; }

        /* Header */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: white; border-bottom: 1px solid #e2e8f0; position: relative;
        }
        body.dark .app-header { background: #0f172a; border-color: #1e293b; }
        .header-icon-btn {
            background: none; border: none; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0f172a;
        }
        body.dark .header-icon-btn { color: #e2e8f0; }
        .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

        /* Search & Category Menu Row */
        .search-row { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; }
        .search-wrapper { display: flex; align-items: center; background: #f1f5f9; border-radius: 10px; padding: 0 12px; flex: 1; }
        body.dark .search-wrapper { background: #1e293b; }
        .search-wrapper svg { width: 18px; height: 18px; fill: #94a3b8; flex-shrink: 0; }
        .search-wrapper input {
            border: none; background: transparent; padding: 10px; font-size: 14px;
            width: 100%; outline: none; color: #0f172a;
        }
        body.dark .search-wrapper input { color: #e2e8f0; }
        
        .home-dots-btn {
            background: white; border: 1px solid #e2e8f0; width: 40px; height: 40px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #64748b; flex-shrink: 0;
        }
        body.dark .home-dots-btn { background: #1e293b; border-color: #334155; }
        .home-dots-btn:hover { color: #3b82f6; border-color: #3b82f6; }

        /* Category Grid */
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-top: 12px; }
        .section-title { font-size: 15px; font-weight: 600; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 16px; }
        
        /* Category Card */
        .category-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 14px;
            padding: 18px 14px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; transition: all 0.15s;
        }
        body.dark .category-card { background: #1e293b; border-color: #334155; }
        .category-card:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.1); }

        .cat-icon-container {
            width: 40px; height: 40px; margin-bottom: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .cat-icon-container img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
        .cat-icon-container svg { width: 100%; height: 100%; fill: #3b82f6; }

        .category-name {
            font-size: 14px; font-weight: 600; word-break: break-word; text-align: center;
            width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Add Button */
        .add-btn {
            background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
        }
        .add-btn-small {
            background: #3b82f6; color: white; border: none; width: 34px; height: 34px; border-radius: 8px;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0;
            display: flex; overflow-x: auto; padding: 6px 8px; gap: 4px; scrollbar-width: none; z-index: 100;
        }
        body.dark .bottom-nav { background: #0f172a; border-color: #1e293b; }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 6px 10px; border-radius: 10px; font-size: 10px; font-weight: 500;
            color: #64748b; cursor: pointer; white-space: nowrap; flex-shrink: 0; min-width: 50px;
            background: transparent; border: none;
        }
        body.dark .nav-item { color: #94a3b8; }
        .nav-item svg { width: 18px; height: 18px; fill: currentColor; margin-bottom: 2px; }
        .nav-item.active { background: #eff6ff; color: #3b82f6; }
        body.dark .nav-item.active { background: #1e293b; color: #60a5fa; }

        /* Category Page View */
        .category-page-header {
            display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        body.dark .category-page-header { background: #0f172a; border-color: #1e293b; }
        .back-btn {
            background: none; border: none; width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0f172a;
        }
        body.dark .back-btn { color: #e2e8f0; }

        /* Link Options Row */
        .link-options-row {
            display: flex; align-items: center; justify-content: flex-end;
            padding: 8px 16px 0 16px;
        }
        .link-dots-btn {
            background: #f1f5f9; border: none; width: 36px; height: 36px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #64748b;
        }
        body.dark .link-dots-btn { background: #334155; }
        .link-dots-btn:hover { color: #3b82f6; }

        /* Link List (Folder Style) */
        .link-list { padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
        
        .link-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 14px; background: white; border: 1px solid #e2e8f0;
            border-radius: 12px; cursor: pointer; transition: all 0.15s;
        }
        body.dark .link-row { background: #1e293b; border-color: #334155; }
        .link-row:hover { border-color: #3b82f6; box-shadow: 0 2px 8px rgba(59,130,246,0.08); }
        
        .link-info { display: flex; align-items: center; gap: 12px; flex: 1; padding-right: 8px; overflow: hidden; }
        .link-favicon {
            width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #f1f5f9; color: #64748b; font-size: 16px;
        }
        body.dark .link-favicon { background: #334155; }
        .link-favicon img { width: 20px; height: 20px; object-fit: contain; }
        
        .link-name { font-size: 15px; font-weight: 600; word-break: break-word; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal / Form */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px;
        }
        .modal-card {
            background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto;
        }
        body.dark .modal-card { background: #1e293b; }
        .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 4px; }
        body.dark .form-group label { color: #94a3b8; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1;
            font-size: 14px; background: white; color: #0f172a; outline: none;
        }
        body.dark .form-group input, body.dark .form-group select { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        .form-actions { display: flex; gap: 8px; margin-top: 20px; }
        .btn-secondary {
            background: #f1f5f9; color: #0f172a; border: none; padding: 12px; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; flex: 1;
        }
        body.dark .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-primary-sm {
            background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; flex: 1;
        }

        /* Dropdowns */
        .dropdown {
            position: absolute; top: 56px; right: 12px; background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 1px solid #e2e8f0; z-index: 150;
            min-width: 180px; overflow: hidden;
        }
        body.dark .dropdown { background: #1e293b; border-color: #334155; }
        .dropdown-left { right: auto; left: 12px; }
        .dropdown-item {
            padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
            display: flex; align-items: center; gap: 8px;
        }
        body.dark .dropdown-item { border-color: #334155; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #f8fafc; }
        body.dark .dropdown-item:hover { background: #334155; }

        /* Search result item */
        .search-result-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        body.dark .search-result-item { border-color: #334155; }
        .search-result-item:hover { background: #f8fafc; }
        body.dark .search-result-item:hover { background: #334155; }

        /* Toast */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; z-index: 300; animation: fadeUp 0.2s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px; }
        
        /* Selection List inside Modals */
        .select-list-item {
            padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .select-list-item:hover { background: #f8fafc; }
        body.dark .select-list-item { border-color: #334155; }
        body.dark .select-list-item:hover { background: #334155; }
    </style>
</head>
<body>

<!-- ========== LOGIN SCREEN ========== -->
<div id="loginScreen">
    <div class="login-card">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
        </div>
        <div class="app-title">MY APPS HUB</div>
        <div class="input-group">
            <label>User ID</label>
            <input type="text" id="loginUserId" placeholder="Enter your ID" autocomplete="username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
                <button class="toggle-password" type="button" id="toggleLoginPassword">SHOW</button>
            </div>
        </div>
        <button class="btn-primary" id="loginBtn">Login</button>
        <div class="error-msg" id="loginError"></div>
    </div>
</div>

<!-- ========== MAIN APP ========== -->
<div id="mainApp" class="hidden">
    
    <!-- Header -->
    <div class="app-header">
        <button class="header-icon-btn" id="menuBtn">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 12h18v2H3v-2zm0-5h18v2H3V7zm0 10h18v2H3v-2z"/></svg>
        </button>
        <div class="header-title" id="headerTitle">MY APPS HUB</div>
        <div id="headerRightActions" style="display:flex; gap:4px;">
            <button class="header-icon-btn" id="profileBtn">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Search Bar & Category Options (Home Only) -->
    <div class="search-row" id="homeSearchRow">
        <div class="search-wrapper">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search categories or apps...">
        </div>
        <button class="home-dots-btn" id="homeDotsBtn">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
    </div>

    <!-- Home View -->
    <div id="homeView">
        <div class="section-header">
            <span class="section-title">My Categories</span>
            <button class="add-btn" id="addCategoryBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Add
            </button>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
        <div id="searchResults" class="hidden" style="padding: 0 16px;"></div>
    </div>

    <!-- Category Detail View -->
    <div id="categoryView" class="hidden">
        <div class="category-page-header">
            <button class="back-btn" id="backToHomeBtn">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="font-semibold" id="categoryViewTitle" style="flex:1; font-size: 16px;"></span>
            <button class="add-btn-small" id="addLinkBtn">+</button>
        </div>
        <div class="link-options-row">
            <button class="link-dots-btn" id="linkDotsBtn">
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
        <div class="link-list" id="linkList"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- ========== MODAL CONTAINER ========== -->
<div id="modalContainer"></div>

<!-- ========== LEFT MENU DROPDOWN ========== -->
<div id="leftMenuDropdown" class="dropdown dropdown-left hidden" style="top: 54px; left: 16px; max-height: 60vh; overflow-y: auto;">
    <div id="leftMenuCategoryList"></div>
</div>

<!-- ========== PROFILE DROPDOWN ========== -->
<div id="profileDropdown" class="dropdown hidden">
    <div class="dropdown-item" data-action="profile">👤 Profile</div>
    <div class="dropdown-item" data-action="changeId">🔑 Change Admin ID</div>
    <div class="dropdown-item" data-action="changePassword">🔒 Change Password</div>
    <div class="dropdown-item" data-action="userManagement">👥 User Management</div>
    <div class="dropdown-item" data-action="backup">💾 Backup & Restore</div>
    <div class="dropdown-item" data-action="appearance">🌓 Appearance</div>
    <div class="dropdown-item" data-action="logout">🚪 Logout</div>
</div>

<!-- ========== HOME CATEGORY MENU DROPDOWN ========== -->
<div id="homeCategoryMenu" class="dropdown hidden" style="top: 54px; right: 12px; min-width: 160px;">
    <div class="dropdown-item" id="homeCatEdit">✏️ Edit Category</div>
    <div class="dropdown-item" id="homeCatDelete" style="color:#ef4444;">🗑️ Delete Category</div>
</div>

<!-- ========== LINK MENU DROPDOWN (Inside Category) ========== -->
<div id="linkMenu" class="dropdown hidden" style="top: 54px; right: 12px; min-width: 160px;">
    <div class="dropdown-item" id="linkEditBtn">✏️ Edit Link</div>
    <div class="dropdown-item" id="linkDeleteBtn" style="color:#ef4444;">🗑️ Delete Link</div>
</div>

<script>
    const STORAGE_KEY = 'myAppHub_v1';
    const DEMO_ADMIN_ID = 'Admin';
    const DEMO_ADMIN_PASS = '12345';

    let state = {
        version: 1, users: [], categories: [], links: [],
        theme: 'light', currentUser: null, isFirstLogin: false
    };

    function generateSalt() {
        const arr = new Uint8Array(16);
        if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
        else for (let i = 0; i < 16; i++) arr[i] = Math.floor(Math.random() * 256);
        return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
    }

    async function hashPassword(password, salt) {
        if (!window.crypto || !window.crypto.subtle) {
            let hash = 0; const str = password + salt;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; }
            return 'fallback_' + hash.toString(16);
        }
        try {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
            const derivedBits = await window.crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256);
            return Array.from(new Uint8Array(derivedBits), b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
            let hash = 0; const str = password + salt;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; }
            return 'fallback_' + hash.toString(16);
        }
    }

    async function verifyPassword(password, salt, storedHash) { return (await hashPassword(password, salt)) === storedHash; }

    function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { try { const parsed = JSON.parse(raw); if (parsed.version === 1) state = parsed; } catch (e) {} }
        if (!state.users) state.users = []; if (!state.categories) state.categories = [];
        if (!state.links) state.links = []; if (!state.theme) state.theme = 'light';
        if (state.currentUser === undefined) state.currentUser = null;
        if (state.isFirstLogin === undefined) state.isFirstLogin = false;
    }

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function getCategories() { return state.categories; }
    function saveCategory(cat) {
        cat.id = cat.id || 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        state.categories.push(cat); saveState(); return cat;
    }
    function updateCategory(id, updates) {
        const idx = state.categories.findIndex(c => c.id === id);
        if (idx > -1) Object.assign(state.categories[idx], updates); saveState();
    }
    function deleteCategory(id) {
        state.categories = state.categories.filter(c => c.id !== id);
        state.links = state.links.filter(l => l.categoryId !== id); saveState();
    }
    function getLinks(categoryId) { return !categoryId ? state.links : state.links.filter(l => l.categoryId === categoryId); }
    function saveLink(link) {
        link.id = link.id || 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        state.links.push(link); saveState(); return link;
    }
    function updateLink(id, updates) {
        const idx = state.links.findIndex(l => l.id === id);
        if (idx > -1) Object.assign(state.links[idx], updates); saveState();
    }
    function deleteLink(id) { state.links = state.links.filter(l => l.id !== id); saveState(); }
    function findUserById(userId) { return state.users.find(u => u.userId === userId); }
    
    async function createUser(userId, password, role = 'user', active = true) {
        const salt = generateSalt(); const hash = await hashPassword(password, salt);
        const user = { id: 'user_' + Date.now(), userId, passwordHash: hash, salt, role, active };
        state.users.push(user); saveState(); return user;
    }

    async function updateUserPassword(userId, newPassword) {
        const user = findUserById(userId); if (!user) return false;
        user.salt = generateSalt(); user.passwordHash = await hashPassword(newPassword, user.salt);
        saveState(); return true;
    }
    function deleteUser(userId) { state.users = state.users.filter(u => u.userId !== userId); saveState(); }

    async function loginUser(userId, password) {
        let user = findUserById(userId);
        if (!user && userId === DEMO_ADMIN_ID && password === DEMO_ADMIN_PASS) {
            await createUser(DEMO_ADMIN_ID, DEMO_ADMIN_PASS, 'admin', true);
            state.isFirstLogin = true; saveState(); user = findUserById(DEMO_ADMIN_ID);
        }
        if (!user) return { ok: false, error: 'User not found' };
        if (!user.active) return { ok: false, error: 'Account is inactive' };
        if (!(await verifyPassword(password, user.salt, user.passwordHash))) return { ok: false, error: 'Wrong password' };
        state.currentUser = userId; saveState(); return { ok: true, user };
    }

    function logoutUser() { state.currentUser = null; saveState(); }

    function exportBackup() {
        const backup = { version: 1, exportedAt: new Date().toISOString(), categories: state.categories, links: state.links, theme: state.theme };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `myappshub_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click(); URL.revokeObjectURL(a.href);
    }

    async function importBackup(jsonData, mode) {
        if (!jsonData.categories || !jsonData.links) throw new Error('Invalid backup');
        if (mode === 'replace') {
            state.categories = jsonData.categories; state.links = jsonData.links;
            if (jsonData.theme) state.theme = jsonData.theme;
        } else if (mode === 'merge') {
            const existingCatNames = new Set(state.categories.map(c => c.name));
            state.categories = [...state.categories, ...jsonData.categories.filter(c => !existingCatNames.has(c.name))];
            const existingLinks = new Set(state.links.map(l => l.categoryId + '|' + l.url));
            state.links = [...state.links, ...jsonData.links.filter(l => l.categoryId && l.url && !existingLinks.has(l.categoryId + '|' + l.url))];
        }
        saveState(); return true;
    }

    async function init() {
        loadState();
        if (state.users.length === 0) {
            await createUser(DEMO_ADMIN_ID, DEMO_ADMIN_PASS, 'admin', true);
            state.isFirstLogin = true; saveState();
        }
        applyTheme(state.theme);
        if (state.currentUser) {

            if (user && user.active) { showMainApp(); return; }
            else { state.currentUser = null; saveState(); }

    function applyTheme(theme) { document.body.classList.toggle('dark', theme === 'dark'); state.theme = theme; saveState(); }

    async function handleLogin() {
        const userId = loginUserId.value.trim(); const password = loginPassword.value;
        loginError.textContent = '';
        if (!userId || !password) { loginError.textContent = 'Please enter both ID and password.'; return; }
        const result = await loginUser(userId, password);
        if (!result.ok) { loginError.textContent = result.error; return; }
        if (state.isFirstLogin && result.user.userId === DEMO_ADMIN_ID && result.user.role === 'admin') {

    }

    // Helper to convert Google Drive links and load images safely
    function getCategoryIconHtml(iconData) {
        if (!iconData) {
            return '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
        }
        
        let finalUrl = iconData;
        
        // AUTO-CONVERT Google Drive Links
        if (finalUrl.includes('drive.google.com/file/d/')) {
            const match = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                finalUrl = `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
        }

        if (finalUrl.startsWith('http://') || finalUrl.startsWith('https://') || finalUrl.startsWith('data:image')) {
            return `<img src="${escapeHtml(finalUrl)}" alt="icon" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg viewBox=\\'0 0 24 24\\'><path d=\\'M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z\\'/></svg>'">`;
        }
        return iconData; // Assume it's SVG
    }

    function renderCategories() {
        const cats = getCategories();
        categoryGrid.innerHTML = '';
        if (cats.length === 0) {
            categoryGrid.innerHTML = '<div class="empty-state" style="grid-column: span 2;">No categories yet. Tap "Add" to create one.</div>';
        } else {
            cats.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'category-card';
                
                card.innerHTML = `
                    <div class="cat-icon-container">${getCategoryIconHtml(cat.icon)}</div>
                    <div class="category-name">${escapeHtml(cat.name)}</div>
                `;
                
                card.addEventListener('click', () => openCategory(cat.id));
                categoryGrid.appendChild(card);
            });
        }
        searchResults.classList.add('hidden'); searchInput.value = '';
    }

    function renderBottomNav() {
        const cats = getCategories();
        bottomNav.innerHTML = '';

        const homeItem = document.createElement('button');
        homeItem.className = 'nav-item' + (currentCategoryId === null ? ' active' : '');
        homeItem.innerHTML = `<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home`;

            if (navIcon && (navIcon.startsWith('http') || navIcon.startsWith('data:'))) {
                navIcon = '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
            }
            item.innerHTML = `${navIcon || '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'}${escapeHtml(cat.name)}`;
            item.addEventListener('click', () => openCategory(cat.id));

    function openCategory(id) {
        currentCategoryId = id; homeView.classList.add('hidden');
        categoryView.classList.remove('hidden'); renderCategoryDetail();
        renderBottomNav(); renderHeaderAndSearch();
    }

    function getLinkFavicon(url) {
        try {
            const urlObj = new URL(url);
            return `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=64`;
        } catch { return null; }
    }

    function renderCategoryDetail() {
        const cat = getCategories().find(c => c.id === currentCategoryId);
        if (!cat) { backToHome(); return; }
        categoryViewTitle.textContent = cat.name;
        const links = getLinks(currentCategoryId);
        linkList.innerHTML = '';
        
        if (links.length === 0) {
            linkList.innerHTML = '<div class="empty-state">No links yet. Tap "+" to add one.</div>';
        } else {
            links.forEach(link => {
                const row = document.createElement('div');
                row.className = 'link-row';
                
                const faviconUrl = getLinkFavicon(link.url);
                const faviconHtml = faviconUrl 
                    ? `<img src="${faviconUrl}" alt="icon" onerror="this.style.display='none'; this.parentElement.innerHTML='🔗'">` 
                    : '🔗';

                row.innerHTML = `
                    <div class="link-info">
                        <div class="link-favicon">${faviconHtml}</div>
                        <span class="link-name">${escapeHtml(link.name)}</span>
                    </div>
                `;
                
                row.addEventListener('click', () => {
                    window.open(link.url, '_blank');
                });
                linkList.appendChild(row);
            });
        }
    }

    function backToHome() {
        currentCategoryId = null; homeView.classList.remove('hidden');
        categoryView.classList.add('hidden'); renderAll();
    }

    function performSearch(query) {
        query = query.trim().toLowerCase();
        if (!query) { searchResults.classList.add('hidden'); categoryGrid.classList.remove('hidden'); return; }
        categoryGrid.classList.add('hidden'); searchResults.classList.remove('hidden'); searchResults.innerHTML = '';
        const cats = getCategories().filter(c => c.name.toLowerCase().includes(query));
        const links = state.links.filter(l => l.name.toLowerCase().includes(query));
        if (!cats.length && !links.length) { searchResults.innerHTML = '<div class="empty-state">No results found.</div>'; return; }
        cats.forEach(cat => {
            const div = document.createElement('div'); div.className = 'search-result-item';
            div.innerHTML = `<span class="font-medium">📁 ${escapeHtml(cat.name)}</span>`;
            div.addEventListener('click', () => openCategory(cat.id)); searchResults.appendChild(div);
        });
        links.forEach(link => {
            const cat = state.categories.find(c => c.id === link.categoryId);
            const div = document.createElement('div'); div.className = 'search-result-item';
            div.innerHTML = `<span class="font-medium">🔗 ${escapeHtml(link.name)}</span> <span class="text-xs" style="color:#64748b;">in ${escapeHtml(cat ? cat.name : '')}</span>`;
            div.addEventListener('click', () => window.open(link.url, '_blank')); searchResults.appendChild(div);
        });
    }

    function showModal(html, onClose) {
        modalContainer.innerHTML = '';
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-card">${html}</div>`;
        overlay.addEventListener('click', (e) => { if (e.target === overlay) { closeModal(); if (onClose) onClose(); } });
        modalContainer.appendChild(overlay); return overlay;
    }
    function closeModal() { modalContainer.innerHTML = ''; }

    function showCategoryModal(existing = null) {
        const isEdit = !!existing;
        const html = `
            <div class="modal-title">${isEdit ? 'Edit Category' : 'New Category'}</div>
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="catNameInput" value="${isEdit ? escapeHtml(existing.name) : ''}" placeholder="e.g. Personal">
            </div>
            <div class="form-group">
                <label>Icon Image URL (Google Drive links supported)</label>

            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="cancelCatBtn">Cancel</button>
                <button class="btn-primary-sm" id="saveCatBtn">${isEdit ? 'Update' : 'Save'}</button>
            </div>
        `;
        const overlay = showModal(html);
        overlay.querySelector('#cancelCatBtn').addEventListener('click', closeModal);
        overlay.querySelector('#saveCatBtn').addEventListener('click', () => {

    function showChangePasswordModal(forced = false) {
        const html = `
            <div class="modal-title">Change Password ${forced ? '(Required)' : ''}</div>
            ${forced ? '<p class="text-sm mb-2" style="color:#dc2626;">You must change the default password.</p>' : ''}

            <div class="form-group"><label>New Password</label><input type="password" id="newPassInput"></div>
            <div class="form-group"><label>Confirm New Password</label><input type="password" id="confPassInput"></div>
            <div class="form-actions">
                ${forced ? '' : '<button class="btn-secondary" id="cancelPassBtn">Cancel</button>'}
                <button class="btn-primary-sm" id="savePassBtn">Update</button>
            </div>
        `;
        const overlay = showModal(html, forced ? () => {} : null);
        if (!forced) overlay.querySelector('#cancelPassBtn').addEventListener('click', closeModal);
        overlay.querySelector('#savePassBtn').addEventListener('click', async () => {
            const cur = overlay.querySelector('#curPassInput').value;
            const newP = overlay.querySelector('#newPassInput').value;
            const conf = overlay.querySelector('#confPassInput').value;
            if (!cur || !newP || !conf) return alert('Fill all fields');
            if (newP !== conf) return alert('Passwords do not match');
            if (newP.length < 4) return alert('Password too short');
            const user = findUserById(state.currentUser);
            if (!(await verifyPassword(cur, user.salt, user.passwordHash))) return alert('Current password incorrect');
            await updateUserPassword(user.userId, newP);
            state.isFirstLogin = false; saveState(); closeModal(); toast('Password changed');
            if (forced) renderAll();
        });
    }

    function showCreateUserForm() {
        const html = `
            <div class="modal-title">Create New User</div>

            <div class="form-group"><label>Password</label><input type="password" id="newUserPass"></div>

            </div>
        `;
        const overlay = showModal(html);
        overlay.querySelector('#cancelNewUser').addEventListener('click', closeModal);
        overlay.querySelector('#saveNewUser').addEventListener('click', async () => {
            const userId = overlay.querySelector('#newUserId').value.trim();
            const pass = overlay.querySelector('#newUserPass').value;
            const role = overlay.querySelector('#newUserRole').value;
            if (!userId || !pass) return alert('Fill all fields');
            if (findUserById(userId)) return alert('ID exists');
            await createUser(userId, pass, role, true);
            closeModal(); toast('User created'); showUserManagement();
        });
    }

    function showBackupModal() {
        const html = `
            <div class="modal-title">Backup & Restore</div>
            <button class="btn-primary w-full mb-3" id="exportBtn">📤 Export Backup</button>
            <div style="border-top:1px solid #e2e8f0;padding-top:16px;">
                <div class="text-sm mb-2">Import Backup</div>
                <input type="file" id="importFileInput" accept=".json" class="mb-2 w-full">
                <div class="flex gap-2 mb-3">
                    <label class="text-sm"><input type="radio" name="importMode" value="merge" checked> Merge</label>
                    <label class="text-sm"><input type="radio" name="importMode" value="replace"> Replace</label>
                </div>
                <button class="btn-primary w-full" id="importBtn" disabled>📥 Import</button>
            </div>
            <button class="btn-secondary w-full mt-3" id="closeBackup">Close</button>
        `;
        const overlay = showModal(html);
        overlay.querySelector('#exportBtn').addEventListener('click', exportBackup);
        overlay.querySelector('#closeBackup').addEventListener('click', closeModal);
        const fileInput = overlay.querySelector('#importFileInput');
        const importBtn = overlay.querySelector('#importBtn');
        let fileData = null;
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) { importBtn.disabled = true; return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                try { fileData = JSON.parse(ev.target.result); if (!fileData.categories || !fileData.links) throw new Error(); importBtn.disabled = false; }
                catch { alert('Invalid JSON'); importBtn.disabled = true; }
            };
            reader.readAsText(file);
        });
        importBtn.addEventListener('click', async () => {
            if (!fileData) return;
            try { await importBackup(fileData, overlay.querySelector('input[name="importMode"]:checked').value); closeModal(); renderAll(); toast('Imported'); }
            catch (e) { alert('Failed: ' + e.message); }
        });
    }

    function showAppearanceModal() {
        const html = `
            <div class="modal-title">Appearance</div>
            <div class="flex gap-3 mb-4">
                <button class="btn-secondary" id="lightThemeBtn" style="flex:1; ${state.theme === 'light' ? 'background:#3b82f6;color:white;' : ''}">Light</button>
                <button class="btn-secondary" id="darkThemeBtn" style="flex:1; ${state.theme === 'dark' ? 'background:#3b82f6;color:white;' : ''}">Dark</button>
            </div>
            <button class="btn-secondary w-full" id="closeAppearance">Close</button>
        `;
        const overlay = showModal(html);
        overlay.querySelector('#lightThemeBtn').addEventListener('click', () => { applyTheme('light'); closeModal(); });
        overlay.querySelector('#darkThemeBtn').addEventListener('click', () => { applyTheme('dark'); closeModal(); });
        overlay.querySelector('#closeAppearance').addEventListener('click', closeModal);
    }

    function showProfileModal() {
        const user = findUserById(state.currentUser);
        if (!user) return;
        const html = `
            <div class="modal-title">Admin Profile</div>
            <p><strong>User ID:</strong> ${escapeHtml(user.userId)}</p>
            <p><strong>Role:</strong> ${user.role}</p>
            <p><strong>Status:</strong> ${user.active ? 'Active' : 'Inactive'}</p>
            <button class="btn-secondary w-full mt-3" id="closeProfile">Close</button>
        `;
        const overlay = showModal(html);
        overlay.querySelector('#closeProfile').addEventListener('click', closeModal);
    }

    function isCurrentUserAdmin() {
        const user = findUserById(state.currentUser);
        return user && user.role === 'admin';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    function toast(msg) {
        const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
        document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
    }

    // --- Event Listeners ---
    
    // Left Menu (Hamburger)
    menuBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); 
        const cats = getCategories();
        leftMenuCategoryList.innerHTML = cats.length === 0 
            ? '<div class="dropdown-item text-sm" style="color:#94a3b8; cursor:default;">No categories yet</div>' 
            : cats.map(c => `<div class="dropdown-item left-cat-item" data-id="${c.id}">📁 ${escapeHtml(c.name)}</div>`).join('');
        
        leftMenuCategoryList.querySelectorAll('.left-cat-item').forEach(item => {
            item.addEventListener('click', () => {
                leftMenuDropdown.classList.add('hidden');
                openCategory(item.dataset.id);
            });
        });
        leftMenuDropdown.classList.toggle('hidden'); 
        profileDropdown.classList.add('hidden'); 
        homeCategoryMenu.classList.add('hidden');
        linkMenu.classList.add('hidden');
    });
    
    // Profile Menu
    profileBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); 
        profileDropdown.classList.toggle('hidden'); 
        leftMenuDropdown.classList.add('hidden'); 
        homeCategoryMenu.classList.add('hidden');
        linkMenu.classList.add('hidden');
    });
    
    profileDropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.dropdown-item'); if (!item) return;
        profileDropdown.classList.add('hidden');
        switch (item.dataset.action) {
            case 'profile': showProfileModal(); break;
            case 'changeId': showChangeIdModal(); break;
            case 'changePassword': showChangePasswordModal(false); break;
            case 'userManagement': showUserManagement(); break;
            case 'backup': showBackupModal(); break;
            case 'appearance': showAppearanceModal(); break;
            case 'logout': logoutUser(); loginScreen.classList.remove('hidden'); mainApp.classList.add('hidden'); loginUserId.value = ''; loginPassword.value = ''; loginError.textContent = ''; break;
        }
    });

    // Home Dots (Category Options)
    homeDotsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        homeCategoryMenu.classList.toggle('hidden');
        leftMenuDropdown.classList.add('hidden');
        profileDropdown.classList.add('hidden');
        linkMenu.classList.add('hidden');
    });

    homeCatEdit.addEventListener('click', () => {
        homeCategoryMenu.classList.add('hidden');
        showSelectCategoryModal('edit');
    });

    homeCatDelete.addEventListener('click', () => {
        homeCategoryMenu.classList.add('hidden');
        showSelectCategoryModal('delete');
    });

    // Link Dots (Inside Category View)
    linkDotsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        linkMenu.classList.toggle('hidden');
        leftMenuDropdown.classList.add('hidden');
        profileDropdown.classList.add('hidden');
        homeCategoryMenu.classList.add('hidden');
    });

    linkEditBtn.addEventListener('click', () => {
        linkMenu.classList.add('hidden');
        showSelectLinkModal('edit');
    });

    linkDeleteBtn.addEventListener('click', () => {
        linkMenu.classList.add('hidden');
        showSelectLinkModal('delete');
    });

    // Close all dropdowns if clicked outside
    document.addEventListener('click', (e) => { 
        if (!menuBtn.contains(e.target) && !leftMenuDropdown.contains(e.target)) leftMenuDropdown.classList.add('hidden');
        if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) profileDropdown.classList.add('hidden');
        if (!homeDotsBtn.contains(e.target) && !homeCategoryMenu.contains(e.target)) homeCategoryMenu.classList.add('hidden');
        if (!linkDotsBtn.contains(e.target) && !linkMenu.contains(e.target)) linkMenu.classList.add('hidden');
    });

    toggleLoginPassword.addEventListener('click', () => { const isPass = loginPassword.type === 'password'; loginPassword.type = isPass ? 'text' : 'password'; toggleLoginPassword.textContent = isPass ? 'HIDE' : 'SHOW'; });
    loginBtn.addEventListener('click', handleLogin);
    loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
    addCategoryBtn.addEventListener('click', () => { if (!isCurrentUserAdmin()) return alert('Admin only'); showCategoryModal(); });
    addLinkBtn.addEventListener('click', () => { if (!isCurrentUserAdmin()) return alert('Admin only'); if (currentCategoryId) showLinkModal(); });
    backToHomeBtn.addEventListener('click', backToHome);
    searchInput.addEventListener('input', (e) => performSearch(e.target.value));

    init();
</script>
</body>
</html>
